<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar ou cadastrar</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <!--'bootstrap.min.CSS' é um compilasdo de codigos de estilização CSS e o link acima puxa toda essa framework-->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
      function login() {}
    </script>
  </head>
  <body class="bg-light">
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center py-4"
    >
      <div
        class="card shadow-sm rounded-4 p-4"
        style="max-width: 480px; width: 100%"
      >
        
          <div class="text mb-4">
            <div class="text mb-4">
              <h1><strong>Entrar</strong></h1>
              <p>Informe seus dados para acessar o sistema</p>
            </div>
            <div class="row">
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="email"
                />
              </div>

              <div class="col-md-6">
                <label for="password" class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="*********"
                />
              </div>
              <div class="col-md-12 mt-3">
                <button class="btn btn-dark btn-lg w-100" id="validadion">
                  Entrar
                </button>
              </div>
              <p class="text-muted text-center mt-3">
                Não tem uma conta? <a href="cadastro.html">Cadastrar-se</a>
              </p>
            </div>
          </div>
      </div>
    </div>
  </body>
</html>

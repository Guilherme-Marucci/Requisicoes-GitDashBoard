<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--'bootstrap.min.CSS' é um compilado de codigos de estilização CSS e o link acima puxa toda essa framework-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
      
    </script>
</head>
<body>
    <div class="container">
        <a href="chat.ico"></a>
        <h1>Sistema de chamados</h1>
        <p>Acesse sua conta ou crie um cadastro para abrir um chamdo</p>
        <button class="login" onclick="entrar()">Entrar</button>
        <button class="cadastro" onclick="cadastro()">Cadastrar-se</button>
    </div>
    
</body>
</html>
